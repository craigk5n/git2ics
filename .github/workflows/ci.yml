name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    env:
      # Integration tests build real git repos and assert on golden .ics files
      # containing real commit SHAs. A runner's global/system gitconfig (e.g.
      # commit.gpgsign, core.autocrlf) silently changes those SHAs, so pin them
      # away. See tests/Integration/GitRepoFixture.php.
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
      LC_ALL: C.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Tests
        run: composer test

      - name: PHPStan
        run: composer phpstan

      - name: Psalm
        run: composer psalm

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
      LC_ALL: C.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Infection
        run: composer infection
